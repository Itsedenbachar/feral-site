<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FERAL</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #000;
      color: #fff;
      font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
      height: 100vh;
      overflow: hidden;
    }

    .bg {
      position: fixed;
      inset: 0;
      z-index: 0;
    }

    .bg-layer {
      position: absolute;
      inset: 0;
      background-size: cover;
      background-position: center;
      opacity: 0;
      transition: opacity 0.7s ease;
    }

    .bg-layer.active { opacity: 1; }

    .bg-vignette {
      position: fixed;
      inset: 0;
      z-index: 1;
      background:
        linear-gradient(to right, rgba(0,0,0,0.75) 0%, rgba(0,0,0,0.2) 50%, rgba(0,0,0,0.1) 100%),
        linear-gradient(to bottom, rgba(0,0,0,0.3) 0%, transparent 30%, transparent 70%, rgba(0,0,0,0.4) 100%);
      pointer-events: none;
    }

    .sidebar {
      position: fixed;
      left: 0;
      top: 0;
      bottom: 0;
      width: 320px;
      z-index: 10;
      display: flex;
      flex-direction: column;
      padding: 48px 40px;
    }

    .brand {
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      color: #fff;
      margin-bottom: 60px;
    }

    .project-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 4px;
      overflow-y: auto;
      flex: 1;
    }

    .project-list::-webkit-scrollbar { display: none; }

    .project-item button {
      background: none;
      border: none;
      color: rgba(255,255,255,0.35);
      font-family: inherit;
      font-size: 13px;
      font-weight: 400;
      letter-spacing: 0.04em;
      text-align: left;
      padding: 7px 0;
      cursor: pointer;
      transition: color 0.2s ease, transform 0.2s ease;
      line-height: 1.3;
      width: 100%;
      text-transform: uppercase;
    }

    .project-item button:hover,
    .project-item.active button {
      color: #fff;
      transform: translateX(6px);
    }

    .label {
      position: fixed;
      bottom: 48px;
      right: 48px;
      z-index: 10;
      text-align: right;
    }

    .label-title {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.5);
      margin-bottom: 4px;
    }

    .label-project {
      font-size: 15px;
      font-weight: 500;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: #fff;
    }

    /* Lightbox */
    .lightbox {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.92);
      z-index: 9000;
      align-items: center;
      justify-content: center;
      animation: lbFadeIn 0.25s ease;
    }

    .lightbox.open {
      display: flex;
    }

    @keyframes lbFadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    .lightbox__inner {
      position: relative;
      width: min(90vw, 1200px);
      aspect-ratio: 16/9;
      border-radius: 8px;
      overflow: hidden;
      animation: lbScaleIn 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    @keyframes lbScaleIn {
      from { transform: scale(0.9); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }

    .lightbox__iframe {
      width: 100%;
      height: 100%;
      border: none;
    }

    .lightbox__close {
      position: absolute;
      top: 12px;
      right: 12px;
      background: rgba(0,0,0,0.6);
      border: 1px solid rgba(255,255,255,0.15);
      color: white;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      z-index: 10;
      cursor: pointer;
      transition: background 0.2s;
      font-family: inherit;
    }

    .lightbox__close:hover { background: rgba(255,255,255,0.15); }
  </style>
</head>
<body>

  <div class="bg" id="bg"></div>
  <div class="bg-vignette"></div>

  <nav class="sidebar">
    <div class="brand">FERAL</div>
    <ul class="project-list" id="project-list"></ul>
  </nav>

  <div class="label">
    <div class="label-title">Selected Work</div>
    <div class="label-project" id="active-label"></div>
  </div>

  <div class="lightbox" id="lightbox">
    <div class="lightbox__inner" id="lightbox-inner">
      <button class="lightbox__close" id="lightbox-close">✕</button>
      <iframe class="lightbox__iframe" id="lightbox-iframe" src="about:blank" allow="autoplay; fullscreen; picture-in-picture" allowfullscreen></iframe>
    </div>
  </div>

  <script>
    const PROJECTS = [
      { title: 'ZVEZDA — Short Film',             thumb: 'https://framerusercontent.com/images/95V69KjMRtXphHTwh2yMvgsvk.jpg',   video: 'https://vimeo.com/1146976260' },
      { title: 'AINKER SS26',                     thumb: 'https://framerusercontent.com/images/g95vL7DR4tEUb2ulOvR7vEq1tQ.png',   video: 'https://iframe.mediadelivery.net/embed/457575/f3df6d6d-979d-48bc-90cd-ea18f1788ed2' },
      { title: 'ALEXANDER MALOFEEV — Prelude',    thumb: 'https://framerusercontent.com/images/88q7DN3ZUSZyV5G26tYVQhjmGw.jpg',   video: 'https://vimeo.com/1162708355' },
      { title: 'LYZA — TOT',                      thumb: 'https://framerusercontent.com/images/a5SS9HRw4thfvT5wCVC5luDMw0.jpg',   video: 'https://vimeo.com/1161517747' },
      { title: 'BORN SHY FW26',                   thumb: 'https://framerusercontent.com/images/NepyIgemZlJWFxho5npKLnRzxME.jpg',  video: 'https://vimeo.com/1171861807' },
      { title: 'MASH — Fashion Editorial',        thumb: 'https://framerusercontent.com/images/WrFnVsLZ9jPgA45Quwgt4ChNOaQ.png',  video: 'https://iframe.mediadelivery.net/embed/457575/591ec67c-1097-4551-8bef-dcee25b42383' },
      { title: 'ADIDAS',                          thumb: 'https://framerusercontent.com/images/EGtGCYqhOW6gqcf6weiEduNiUE.png',   video: 'https://iframe.mediadelivery.net/embed/457575/37bc53e4-6350-4fd1-84a0-658005b71979' },
      { title: 'TAMIR GREENBERG — Pass You By',   thumb: 'https://framerusercontent.com/images/fL92iKaIAWNBYlX3nwbcILJqg.jpg',   video: 'https://vimeo.com/1003711808' },
      { title: 'ALEXANDER MALOFEEV — The Lark',   thumb: 'https://framerusercontent.com/images/ccfstWtAQ6D6AXN0i7ujgGMI.jpg',    video: 'https://vimeo.com/1162708659' },
      { title: 'MASH — Fashion Editorial II',     thumb: 'https://framerusercontent.com/images/LK9MM6nfqEZCWbe8b79UxIA.jpg',     video: 'https://vimeo.com/1135286242' },
      { title: 'AINKER FW25',                     thumb: 'https://framerusercontent.com/images/ofeIZxDJ02VE4QScIS8aVBz2Jzw.png', video: 'https://iframe.mediadelivery.net/embed/457575/d872d0b6-6307-410d-9f05-843df9c28a36' },
      { title: 'Matériau éternel — Motty Perry',  thumb: 'https://framerusercontent.com/images/6BE2dw7aXAVGbqMc1wer8BIZTQs.jpg', video: 'https://vimeo.com/996677557' },
      { title: 'JHON LAUNDRY',                    thumb: 'https://framerusercontent.com/images/8J3GyX73dcdX4YlV3MDA0g82lgs.jpg', video: 'https://vimeo.com/660125933' },
      { title: 'STRONGFUL',                       thumb: 'https://framerusercontent.com/images/954SLi64wkZIGJfaxDmshPT2efQ.jpg', video: 'https://vimeo.com/765465571' },
      { title: 'TATAN — MV',                      thumb: 'https://framerusercontent.com/images/Z2sjnWWKrXYJFalA5vXhNUGGby4.jpg', video: 'https://vimeo.com/726039555' },
      { title: 'MASH — Fashion Editorial III',    thumb: 'https://framerusercontent.com/images/f65b5lJDNohM3u85D0m1EtVtg.jpg',   video: 'https://vimeo.com/1084326507' },
      { title: 'ULIKE — Commercial',              thumb: 'https://framerusercontent.com/images/sPsGUEQcewzHV1feudGhRyITlE.jpg',  video: 'https://vimeo.com/1108859882' },
    ];

    function getLightboxUrl(url) {
      if (!url) return null;
      if (url.includes('vimeo.com/') && !url.includes('player.vimeo')) {
        const id = url.split('/').filter(Boolean).pop();
        return `https://player.vimeo.com/video/${id}?autoplay=1`;
      }
      if (url.includes('mediadelivery.net')) {
        return url + '?autoplay=true&muted=false&controls=true';
      }
      return url;
    }

    const bg = document.getElementById('bg');
    const list = document.getElementById('project-list');
    const activeLabel = document.getElementById('active-label');
    const lightbox = document.getElementById('lightbox');
    const lightboxIframe = document.getElementById('lightbox-iframe');
    const lightboxClose = document.getElementById('lightbox-close');
    const lightboxInner = document.getElementById('lightbox-inner');
    let activeIndex = 0;

    // Background layers
    PROJECTS.forEach((p, i) => {
      const layer = document.createElement('div');
      layer.className = 'bg-layer' + (i === 0 ? ' active' : '');
      layer.style.backgroundImage = `url(${p.thumb})`;
      bg.appendChild(layer);
    });

    const layers = bg.querySelectorAll('.bg-layer');

    function activate(index) {
      layers[activeIndex].classList.remove('active');
      list.querySelectorAll('.project-item')[activeIndex].classList.remove('active');
      activeIndex = index;
      layers[activeIndex].classList.add('active');
      list.querySelectorAll('.project-item')[activeIndex].classList.add('active');
      activeLabel.textContent = PROJECTS[index].title;
    }

    function openLightbox(index) {
      const url = getLightboxUrl(PROJECTS[index].video);
      if (!url) return;
      lightboxIframe.src = url;
      lightbox.classList.add('open');
    }

    function closeLightbox() {
      lightbox.classList.remove('open');
      lightboxIframe.src = 'about:blank';
    }

    lightboxClose.addEventListener('click', closeLightbox);
    lightbox.addEventListener('click', (e) => {
      if (!lightboxInner.contains(e.target)) closeLightbox();
    });
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') closeLightbox();
    });

    // Project list
    PROJECTS.forEach((p, i) => {
      const li = document.createElement('li');
      li.className = 'project-item' + (i === 0 ? ' active' : '');
      const btn = document.createElement('button');
      btn.textContent = p.title;
      btn.addEventListener('mouseenter', () => activate(i));
      btn.addEventListener('click', () => openLightbox(i));
      li.appendChild(btn);
      list.appendChild(li);
    });

    activeLabel.textContent = PROJECTS[0].title;
  </script>
</body>
</html>
