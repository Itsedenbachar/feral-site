<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FERAL</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #000;
      color: #fff;
      font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
      height: 100vh;
      overflow: hidden;
    }

    /* Background image layers */
    .bg {
      position: fixed;
      inset: 0;
      z-index: 0;
    }

    .bg-layer {
      position: absolute;
      inset: 0;
      background-size: cover;
      background-position: center;
      opacity: 0;
      transition: opacity 0.7s ease;
    }

    .bg-layer.active {
      opacity: 1;
    }

    /* Dark vignette overlay */
    .bg-vignette {
      position: fixed;
      inset: 0;
      z-index: 1;
      background:
        linear-gradient(to right, rgba(0,0,0,0.75) 0%, rgba(0,0,0,0.2) 50%, rgba(0,0,0,0.1) 100%),
        linear-gradient(to bottom, rgba(0,0,0,0.3) 0%, transparent 30%, transparent 70%, rgba(0,0,0,0.4) 100%);
      pointer-events: none;
    }

    /* Sidebar */
    .sidebar {
      position: fixed;
      left: 0;
      top: 0;
      bottom: 0;
      width: 320px;
      z-index: 10;
      display: flex;
      flex-direction: column;
      padding: 48px 40px;
    }

    .brand {
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      color: #fff;
      margin-bottom: 60px;
    }

    .project-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 4px;
      overflow-y: auto;
      flex: 1;
    }

    .project-list::-webkit-scrollbar { display: none; }

    .project-item {
      cursor: pointer;
    }

    .project-item button {
      background: none;
      border: none;
      color: rgba(255,255,255,0.35);
      font-family: inherit;
      font-size: 13px;
      font-weight: 400;
      letter-spacing: 0.04em;
      text-align: left;
      padding: 7px 0;
      cursor: pointer;
      transition: color 0.2s ease, transform 0.2s ease;
      line-height: 1.3;
      width: 100%;
      text-transform: uppercase;
    }

    .project-item button:hover,
    .project-item.active button {
      color: #fff;
      transform: translateX(6px);
    }

    /* Bottom-right label */
    .label {
      position: fixed;
      bottom: 48px;
      right: 48px;
      z-index: 10;
      text-align: right;
    }

    .label-title {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.5);
      margin-bottom: 4px;
    }

    .label-project {
      font-size: 15px;
      font-weight: 500;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: #fff;
      transition: opacity 0.3s ease;
    }
  </style>
</head>
<body>

  <div class="bg" id="bg"></div>
  <div class="bg-vignette"></div>

  <nav class="sidebar">
    <div class="brand">FERAL</div>
    <ul class="project-list" id="project-list"></ul>
  </nav>

  <div class="label">
    <div class="label-title">Selected Work</div>
    <div class="label-project" id="active-label"></div>
  </div>

  <script>
    const PROJECTS = [
      { title: 'ZVEZDA — Short Film',               thumb: 'https://framerusercontent.com/images/95V69KjMRtXphHTwh2yMvgsvk.jpg' },
      { title: 'AINKER SS26',                        thumb: 'https://framerusercontent.com/images/g95vL7DR4tEUb2ulOvR7vEq1tQ.png' },
      { title: 'ALEXANDER MALOFEEV — Prelude',       thumb: 'https://framerusercontent.com/images/88q7DN3ZUSZyV5G26tYVQhjmGw.jpg' },
      { title: 'LYZA — TOT',                         thumb: 'https://framerusercontent.com/images/a5SS9HRw4thfvT5wCVC5luDMw0.jpg' },
      { title: 'BORN SHY FW26',                      thumb: 'https://framerusercontent.com/images/NepyIgemZlJWFxho5npKLnRzxME.jpg' },
      { title: 'MASH — Fashion Editorial',           thumb: 'https://framerusercontent.com/images/WrFnVsLZ9jPgA45Quwgt4ChNOaQ.png' },
      { title: 'ADIDAS',                             thumb: 'https://framerusercontent.com/images/EGtGCYqhOW6gqcf6weiEduNiUE.png' },
      { title: 'TAMIR GREENBERG — Pass You By',      thumb: 'https://framerusercontent.com/images/fL92iKaIAWNBYlX3nwbcILJqg.jpg' },
      { title: 'ALEXANDER MALOFEEV — The Lark',      thumb: 'https://framerusercontent.com/images/ccfstWtAQ6D6AXN0i7ujgGMI.jpg' },
      { title: 'MASH — Fashion Editorial II',        thumb: 'https://framerusercontent.com/images/LK9MM6nfqEZCWbe8b79UxIA.jpg' },
      { title: 'AINKER FW25',                        thumb: 'https://framerusercontent.com/images/ofeIZxDJ02VE4QScIS8aVBz2Jzw.png' },
      { title: 'Matériau éternel — Motty Perry',     thumb: 'https://framerusercontent.com/images/6BE2dw7aXAVGbqMc1wer8BIZTQs.jpg' },
      { title: 'JHON LAUNDRY',                       thumb: 'https://framerusercontent.com/images/8J3GyX73dcdX4YlV3MDA0g82lgs.jpg' },
      { title: 'STRONGFUL',                          thumb: 'https://framerusercontent.com/images/954SLi64wkZIGJfaxDmshPT2efQ.jpg' },
      { title: 'TATAN — MV',                         thumb: 'https://framerusercontent.com/images/Z2sjnWWKrXYJFalA5vXhNUGGby4.jpg' },
      { title: 'MASH — Fashion Editorial III',       thumb: 'https://framerusercontent.com/images/f65b5lJDNohM3u85D0m1EtVtg.jpg' },
      { title: 'ULIKE — Commercial',                 thumb: 'https://framerusercontent.com/images/sPsGUEQcewzHV1feudGhRyITlE.jpg' },
    ];

    const bg = document.getElementById('bg');
    const list = document.getElementById('project-list');
    const activeLabel = document.getElementById('active-label');
    let activeIndex = 0;

    // Build background layers
    PROJECTS.forEach((p, i) => {
      const layer = document.createElement('div');
      layer.className = 'bg-layer' + (i === 0 ? ' active' : '');
      layer.style.backgroundImage = `url(${p.thumb})`;
      bg.appendChild(layer);
    });

    const layers = bg.querySelectorAll('.bg-layer');

    function activate(index) {
      layers[activeIndex].classList.remove('active');
      list.querySelectorAll('.project-item')[activeIndex].classList.remove('active');
      activeIndex = index;
      layers[activeIndex].classList.add('active');
      list.querySelectorAll('.project-item')[activeIndex].classList.add('active');
      activeLabel.textContent = PROJECTS[index].title;
    }

    // Build list
    PROJECTS.forEach((p, i) => {
      const li = document.createElement('li');
      li.className = 'project-item' + (i === 0 ? ' active' : '');
      const btn = document.createElement('button');
      btn.textContent = p.title;
      btn.addEventListener('mouseenter', () => activate(i));
      li.appendChild(btn);
      list.appendChild(li);
    });

    activeLabel.textContent = PROJECTS[0].title;
  </script>
</body>
</html>
